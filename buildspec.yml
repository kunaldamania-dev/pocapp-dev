version: 0.2

phases:
  build:
    commands:
      - echo "Running application tests..."
      - test -f index.html
      - test -f hello
      - test -f health.html
      - test -f appspec.yml
      - test -f scripts/after_install.sh
      - echo "All required files exist."
      - echo "Testing API response..."
      - grep -q '"status": "success"' hello
      - echo "API response test passed."
      - echo "Build successful."

artifacts:
  files:
    - '**/*'