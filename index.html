<!DOCTYPE html>
<html>
<head>
    <title>pocapp-dev</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding-top: 60px;
        }
 
        .card {
            background: white;
            display: inline-block;
            padding: 30px 50px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
 
        h1 {
            color: #232F3E;
        }
 
        .label {
            color: #555;
            font-weight: bold;
        }
    </style>
</head>
 
<body>
 
<div class="card">
 
    <h1>pocapp-dev - Version 1</h1>
 
    <p>
        <span class="label">Instance ID:</span>
        __INSTANCE_ID__
    </p>
 
    <p>
        <span class="label">Availability Zone:</span>
        __AZ__
    </p>
 
    <p>
        <span class="label">Private IP:</span>
        __PRIVATE_IP__
    </p>
 
    <p>
        <span class="label">Server time:</span>
        __SERVER_TIME__
    </p>
 
</div>
 
</body>
</html>
